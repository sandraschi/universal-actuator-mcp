[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-actuator-mcp"
version = "2.0.0"
description = "Fleet-wide Federation Gateway (Robotics, Media, Infrastructure, Knowledge)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.3",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.134.0",
    "fastmcp>=3.1.0,<4",
    "lancedb>=0.14.0",
    "pyarrow>=19.0.0",
    "sentence-transformers>=3.4.0",
    "keyring>=25.7.0",
    "mcp>=1.26.0",
    "plexapi>=4.18.0",
    "psutil>=7.2.2",
    "py-key-value-aio[disk]>=0.4.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "pytz>=2025.2",
    "ruff>=0.15.2",
    "sqlalchemy>=2.0.47",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.41.0",
    "websockets>=16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
