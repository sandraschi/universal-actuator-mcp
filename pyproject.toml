[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-actuator-mcp"
version = "2.0.0"
description = "Fleet-wide Federation Gateway (Robotics, Media, Infrastructure, Knowledge)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.3",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.134.0",
    "fastmcp>=3.4.4,<4",
    "lancedb>=0.14.0",
    "pyarrow>=19.0.0",
    "sentence-transformers>=3.4.0",
    "keyring>=25.7.0",
    "mcp>=1.26.0",
    "plexapi>=4.18.0",
    "psutil>=7.2.2",
    "py-key-value-aio[disk]>=0.4.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "pytz>=2025.2",
    "sqlalchemy>=2.0.47",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.41.0",
    "websockets>=16.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "prefab-ui>=0.14.0",
]

[project.scripts]
universal-actuator-mcp = "universal_actuator_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S106", "S110", "S112", "S101", "B008", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/cua-smoke.py" = ["S310"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16.0,<0.17", "pre-commit>=4.6.1"]
