repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: biome-webapp
        name: biome (webapp)
        entry: scripts/pre-commit-biome.ps1
        language: script
        files: ^webapp/
        pass_filenames: false
      - id: no-bak
        name: no timestamped .bak files
        entry: powershell.exe -NoProfile -File scripts/pre-commit-no-bak.ps1
        language: system
        always_run: false
